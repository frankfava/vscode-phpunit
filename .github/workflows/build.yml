name: Build VSIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build phpunit package
        run: pnpm --filter @vscode-phpunit/phpunit build

      - name: Package Extension
        working-directory: packages/extension
        run: pnpm vsce package --no-dependencies

      - name: Read extension version
        id: meta
        run: echo "version=$(node -p "require('./packages/extension/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-phpunit-${{ steps.meta.outputs.version }}
          path: 'packages/extension/*.vsix'
          if-no-files-found: error
