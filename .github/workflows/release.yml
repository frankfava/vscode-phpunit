name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for packages/extension
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump extension version
        id: bump
        working-directory: packages/extension
        run: |
          NEW=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"

      - name: Build phpunit package
        run: pnpm --filter @vscode-phpunit/phpunit build

      - name: Package Extension
        working-directory: packages/extension
        run: pnpm vsce package --no-dependencies

      - name: Commit and tag
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/extension/package.json
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          gh release create "v${VERSION}" packages/extension/*.vsix \
            --title "v${VERSION}" \
            --generate-notes
